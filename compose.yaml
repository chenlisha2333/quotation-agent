services:
  quotation-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      QUOTE_APPROVERS_JSON: ${QUOTE_APPROVERS_JSON:-}
      QUOTE_APPROVED_RULE_ID: ${QUOTE_APPROVED_RULE_ID:-}
    volumes:
      - quotation_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  quotation_data:
